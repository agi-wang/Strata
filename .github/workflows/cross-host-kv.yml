name: Cross-host KV
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Wire integrity and bounded allocations
        run: |
          g++ -std=c++20 -O2 -DNDEBUG -Iinclude src/core/conversation_wire_test.cpp -o /tmp/wire-test
          /tmp/wire-test
      - name: Server, security, migration and artifact identity
        run: python -m unittest serve.test_server serve.test_security serve.test_cache_transfer serve.test_kv_gateway tools.test_kv_model_id
